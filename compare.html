<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Compare - The Codex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='38' font-weight='bold' fill='%23f5c542' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="codex.css?v=6">
<link rel="stylesheet" href="codex-shell.css?v=1">
</head>
<body>
<div class="page">

  <div class="codex-header">
    <h1 class="codex-title">Compare</h1>
    <span class="codex-tagline">Put things side by side</span>
  </div>
  <div class="codex-toolbar">
    <span id="cloudSlot"></span>
  </div>

  <div class="box">
    <div class="box-sub">Pick 2-4 things and one dimension. Every column scales against the same maximum, so bar length is honestly comparable slot to slot.</div>
    <div class="filter-bar">
      <span class="toggle-group">
        <button class="btn-link mode-btn active" data-mode="fields" data-group="cmpmode">Fields</button>
        <button class="btn-link mode-btn" data-mode="hours" data-group="cmpmode">Hour Categories</button>
      </span>
      <select id="cmpDim"></select>
    </div>
    <div class="compare-slots" id="cmpSlots"></div>
    <div class="inline-form">
      <button class="btn-link" id="cmpAddSlot" type="button">+ Add slot</button>
    </div>
  </div>

  <div id="cmpResults" class="compare-bars-grid"></div>

</div>

<div class="modal-overlay" id="detailOverlay">
  <div class="modal-box">
    <button class="modal-close" id="detailClose" title="Close">&times;</button>
    <div id="detailBody"></div>
  </div>
</div>

<script src="astronomy.browser.min.js"></script>
<script src="astro-engine.js"></script>
<script src="numerology.js"></script>
<script src="compat-data.js"></script>
<script src="overrides-engine.js"></script>
<script src="compat-engine.js"></script>
<script src="imprint-alignment.js"></script>
<script src="firebase-config.js"></script>
<script src="codex-core.js?v=2"></script>
<script src="codex-compute.js?v=3"></script>
<script src="codex-baseline.js?v=3"></script>
<script src="codex-analytics.js?v=4"></script>
<script src="codex-detail.js?v=1"></script>
<script src="codex-hours.js?v=8"></script>
<script src="codex-cloud.js?v=1"></script>
<script src="codex-shell.js?v=1"></script>
<script src="codex-compare.js?v=1"></script>
</body>
</html>
